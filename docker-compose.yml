# Local development database: PostgreSQL + PostGIS.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: abro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: abro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - abro-db-data:/var/lib/postgresql/data

volumes:
  abro-db-data:
